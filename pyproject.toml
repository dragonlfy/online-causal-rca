[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "online-causal-rca"
version = "0.1.0"
description = "Public reference implementation of OnlineCausalRCA for online causal-graph maintenance and RCQL root-cause queries."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Anonymous Authors"}
]
keywords = ["root cause analysis", "microservices", "causal graph", "observability", "AIOps"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
online-causal-rca = "online_causal_rca.cli:main"

[tool.setuptools.packages.find]
include = ["online_causal_rca*"]
